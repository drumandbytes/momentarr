name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      # CI-config-only changes skip the build; this file re-included so its own edits run.
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Multi-arch image to GHCR plus SLSA provenance. Verify with:
  #   gh attestation verify oci://ghcr.io/drumandbytes/momentarr:latest --owner drumandbytes
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # record the attestation on the repo
      artifact-metadata: write # storage record for the pushed image
    uses: drumandbytes/reusable-actions/.github/workflows/docker-publish.yml@v1
